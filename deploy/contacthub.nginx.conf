server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /var/www/contacthub/current;
    index index.html;

    add_header X-Content-Type-Options nosniff;

    location / {
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
}
